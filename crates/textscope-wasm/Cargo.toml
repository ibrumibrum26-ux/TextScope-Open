[package]
name = "textscope-wasm"
description = "Thin WebAssembly interoperability boundary for TextScope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
textscope-core = { path = "../textscope-core" }
wasm-bindgen = "=0.2.127"

[dev-dependencies]
zip = { version = "=8.6.0", default-features = false }
